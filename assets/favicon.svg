<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f59b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="#0d1117"/>
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1f293d" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gymGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Stylized Dumbbell & Audio Waves -->
  <!-- Center Barbell -->
  <rect x="236" y="160" width="40" height="192" rx="10" fill="#f8fafc"/>
  
  <!-- Left Weight Plates -->
  <rect x="140" y="180" width="36" height="152" rx="12" fill="url(#gymGrad)"/>
  <rect x="186" y="200" width="28" height="112" rx="8" fill="#f8fafc"/>

  <!-- Right Weight Plates -->
  <rect x="298" y="200" width="28" height="112" rx="8" fill="#f8fafc"/>
  <rect x="336" y="180" width="36" height="152" rx="12" fill="url(#gymGrad)"/>

  <!-- Center Microphone / Audio Wave Symbol -->
  <circle cx="256" cy="256" r="32" fill="#0d1117" stroke="url(#gymGrad)" stroke-width="8"/>
  <path d="M256 240v32M246 256h20" stroke="#00f59b" stroke-width="6" stroke-linecap="round"/>
</svg>
